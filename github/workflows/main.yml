name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir cualquier zip en la raíz
        run: |
          shopt -s nullglob
          for f in *.zip; do
            echo "Descomprimiendo: $f"
            unzip -o "$f" -d .
          done

      - name: Ubicar carpeta del proyecto Android
        id: locate
        run: |
          PROJECT_DIR=$(find . -maxdepth 3 -name "settings.gradle.kts" -not -path "*/node_modules/*" | head -n 1 | xargs dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "No se encontró settings.gradle.kts en ningún lado. Contenido del repo:"
            find . -maxdepth 3
            exit 1
          fi
          echo "Proyecto encontrado en: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: gradle assembleDebug --stacktrace

      - name: Buscar el APK generado
        id: findapk
        run: |
          APK_PATH=$(find . -name "app-debug.apk" | head -n 1)
          echo "APK en: $APK_PATH"
          echo "apk=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ steps.findapk.outputs.apk }}
